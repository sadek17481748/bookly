<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookly — Register</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="index.html">Bookly</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Log in</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h1>Create account</h1>

    <div class="panel" style="margin-top:1.5rem">
      <label for="e">Email</label>
      <input id="e" type="email" disabled>

      <label for="p1">Password</label>
      <input id="p1" type="password" disabled>

      <label for="p2">Confirm password</label>
      <input id="p2" type="password" disabled>

      <p style="margin-top:1rem">
        <button type="button" class="btn" disabled>Create account</button>
      </p>
    </div>
  </main>
</body>
