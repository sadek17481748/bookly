<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookly — Log in</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="index.html">Bookly</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="register.html">Register</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h1>Log in</h1>

    <div class="panel" style="margin-top:1.5rem">
      <label for="em">Email</label>
      <input id="em" type="email" autocomplete="username" disabled>

      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" disabled>

      <p style="margin-top:1rem">
        <button type="button" class="btn" disabled>Sign in</button>
      </p>
    </div>
  </main>
</body>
</html>
